<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bodyGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#555f80"/>
      <stop offset="45%" stop-color="#282e44"/>
      <stop offset="90%" stop-color="#141724"/>
      <stop offset="100%" stop-color="#0c0e17"/>
    </radialGradient>
    <radialGradient id="redCap" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b80"/>
      <stop offset="60%" stop-color="#e5484d"/>
      <stop offset="100%" stop-color="#991b1f"/>
    </radialGradient>
    <radialGradient id="yellowCap" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe485"/>
      <stop offset="60%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#a87108"/>
    </radialGradient>
    <linearGradient id="spikeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f5777"/>
      <stop offset="100%" stop-color="#1d2130"/>
    </linearGradient>
  </defs>

  <!-- Spikes -->
  <g stroke="#0f121c" stroke-width="7" stroke-linecap="round">
    <line x1="32" y1="6" x2="32" y2="58"/>
    <line x1="6" y1="32" x2="58" y2="32"/>
    <line x1="13.6" y1="13.6" x2="50.4" y2="50.4"/>
    <line x1="13.6" y1="50.4" x2="50.4" y2="13.6"/>
  </g>
  <g stroke="url(#spikeGrad)" stroke-width="4.5" stroke-linecap="round">
    <line x1="32" y1="7" x2="32" y2="57"/>
    <line x1="7" y1="32" x2="57" y2="32"/>
    <line x1="14.3" y1="14.3" x2="49.7" y2="49.7"/>
    <line x1="14.3" y1="49.7" x2="49.7" y2="14.3"/>
  </g>

  <!-- Spike Caps -->
  <circle cx="32" cy="7" r="3.2" fill="url(#redCap)"/>
  <circle cx="32" cy="57" r="3.2" fill="url(#redCap)"/>
  <circle cx="7" cy="32" r="3.2" fill="url(#redCap)"/>
  <circle cx="57" cy="32" r="3.2" fill="url(#redCap)"/>
  <circle cx="14.3" cy="14.3" r="3.2" fill="url(#yellowCap)"/>
  <circle cx="49.7" cy="49.7" r="3.2" fill="url(#yellowCap)"/>
  <circle cx="14.3" cy="49.7" r="3.2" fill="url(#yellowCap)"/>
  <circle cx="49.7" cy="14.3" r="3.2" fill="url(#yellowCap)"/>

  <!-- Main Mine Sphere -->
  <circle cx="32" cy="32" r="19" fill="url(#bodyGrad)" stroke="#111420" stroke-width="1.8"/>

  <!-- Center Detonator -->
  <circle cx="32" cy="32" r="4.2" fill="url(#redCap)" stroke="#0d101a" stroke-width="1"/>
  <circle cx="31.2" cy="31.2" r="1.2" fill="#fff" opacity="0.8"/>

  <!-- Specular Reflection -->
  <ellipse cx="25.5" cy="23.5" rx="5.5" ry="3.2" transform="rotate(-35 25.5 23.5)" fill="#ffffff" opacity="0.6"/>
  <circle cx="22.5" cy="20.5" r="1.5" fill="#ffffff" opacity="0.85"/>
</svg>